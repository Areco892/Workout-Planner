<!DOCTYPE html>
<html>
    <head>
        <title>Workout</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/workout.css">
        <link rel="stylesheet" href="css/theme.css">
    </head>
    <body>
        <header>
            <h1 id="workout-name"></h1>
        </header>
        
        <main>
            <a href="workout_plan.html">See Workout Plans</a>
            <div id="stopwatch">
                <p id="timer">00:00:00</p>
                <div id="button-panel">
                    <button id="start-timer" type="button">Start</button>
                    <button id="stop-timer" type="button">Stop</button>
                    <button id="resume-timer" type="button">Resume</button>
                    <button id="reset-timer" type="button">Reset</button>
                </div>
            </div>
            <h2 id="congratulations" class="hide"></h2>
            <div id="exercise-container">
            </div>
        </main>

        <script type="module" src="js/workout.js"></script>
    </body>
</html>
