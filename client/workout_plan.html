<!DOCTYPE html>
<html>
    <head>
        <title>Workout Planner</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/workout_plan.css">
        <link rel="stylesheet" href="css/theme.css">
    </head>
    <body>
        
        <header>
            <h1>Workout Planner</h1>
        </header>
        <main>
            <button id="create-btn" type="button">Create New Workout</button>
            <button id="edit-mode-btn" type="button">Edit Workout</button>
            <a href="exercise_selection.html">Add Exercise</a>
            
            <form id="workout-panel" class="hide">
                <h2>New Workout</h2>

                <label for="name">Workout Name: </label>
                <input id="name" name="name" type="text" required>
                <button id="add-workout" type="button">Add Workout Plan</button>
            </form>

            <p id="notification" class="notification"></p>
            
            <div id="workout-container">
            </div>
        </main>

        <script type="module" src="js/workout_plan.js"></script>
    </body>
</html>
